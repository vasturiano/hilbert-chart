<head>
  <title>Hilbert BGP Routing Table</title>

  <script src='//cdn.jsdelivr.net/npm/hilbert-chart'></script>
<!--  <script src='../../dist/hilbert-chart.js'></script>-->

  <style>
    body {
      margin: 0;
      text-align: center;
    }
    #ipv4-chart { display: inline-block; }
  </style>
</head>
<body>
  <div id='ipv4-chart'></div>

  <script type="module">
    import * as Ip from 'https://esm.sh/ip.js';
    import { csvParse } from 'https://esm.sh/d3-dsv';

    const chart = new HilbertChart(document.getElementById('ipv4-chart'), { useCanvas: true })
      .hilbertOrder(32 / 2)
      .rangePaddingAbsolute(1)
      .minCurveWidth(0.7)
      .valFormatter(ipFormatter)
      .showValTooltip(false)
      .rangeColor(d => d.infos ? 'rgba(0,0,128,0.07)' : 'rgba(255,50,0,0.45)')
      .rangeLabelColor(d => d.infos ? 'rgba(0,0,64,0.7)' : 'rgba(165, 42, 42, 0.55)')
      .rangeTooltipContent(d => `<b>${d.name || ''}</b>: ${prefixFormatter(d)}`)
      .onRangeClick(d => chart.focusOn(d.start, d.length, 3000));

    // Get the IANA data
    fetch('../ipv4-address-space/ipv4-address-space.csv').then(r => r.text()).then(csvParse).then(data => {
      data.forEach(row => {
        row.prefix = row.Prefix;
        row.name = row.Designation;
      });

      const ianaData = parseIpData(data);
      chart.data(ianaData);

      // Get BGP routing table data
      const ipv4PrefixRegex = /(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\/(?:3[0-2]|[12]?\d)/;
      const originAsnRegex = /\d+(?=\D*[ie?]\s*$)/;
      fetch('https://bgp.potaroo.net/as2.0/bgptable.txt')
        .then(r => r.text())
        .then(text => {
          const rows = text.split(/\r?\n/);

          const routes = rows.map(row => {
            const matches = row.match(ipv4PrefixRegex);
            const origin = matches && row.match(originAsnRegex)?.[0];
            return matches ? [new Ip.Prefix(matches[0]), origin] : null;
          }).filter(route => route);

          const data = routes.map(([p, asn]) => ({
            start: p.firstIp().toNum(),
            length: p.countIps(),
            name: `AS${asn}`
          })).sort((a, b) => b.length - a.length);

          chart.data([...ianaData, ...data]);
        });
    });

    //

    function parseIpData(ipData) {
      const prefixes = [];

      ipData.map(row => {
        const pref = new Ip.Prefix(row.prefix);
        return {
          start: pref.firstIp().toNum(),
          length: pref.countIps(),
          name: getName(row.name),
          infos: [row]
        };
      }).forEach(prefix => {
        let last;

        if (prefixes.length
          && (last = prefixes[prefixes.length - 1])
          && last.name === prefix.name
          && (last.start + last.length === prefix.start)) {

          last.length += prefix.length;
          last.infos.push(prefix.infos[0]);
        } else {
          prefixes.push(prefix);
        }
      });

      return prefixes;

      //

      function getName(designation) {
        let name = designation;

        if (name.indexOf('Administered by') > -1) {
          name = 'Various Registries';
        }

        return name;
      }
    }

    function ipFormatter(d) {
      return new Ip.Addr(d).toString();
    }

    function prefixFormatter(d) {
      const ipRange = new Ip.Range(d.start, d.start + d.length - 1),
        prefixes = ipRange.toPrefixes();

      return (prefixes.length === 1 ? prefixes[0] : ipRange).toString();
    }
  </script>
</body>
